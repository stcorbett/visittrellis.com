<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trellis">
  <!-- Peach plate -->
  <rect width="64" height="64" rx="14" fill="#faecd2"/>

  <!-- Silphium seed outline + seed-pod chambers.
       Three-color botanical-ish reading of the ancient heart shape:
         - coral outline (the pod silhouette + chamber divisions)
         - sun-yellow seeds visible inside the chambers
         - peach plate behind -->
  <g fill="none" stroke="#de5a4f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Heart / seed-pod outline -->
    <path d="M32 53 C 9 38 9 17 22 17 C 28 17 31 20 32 25 C 33 20 36 17 42 17 C 55 17 55 38 32 53 Z"/>
    <!-- Central seed-pod opening -->
    <line x1="32" y1="25" x2="32" y2="49"/>
    <!-- Two horizontal chamber dividers -->
    <path d="M24 34 Q 32 37 40 34"/>
    <path d="M26 42 Q 32 44 38 42"/>
  </g>

  <!-- Seeds: small sun-yellow dots inside the chambers -->
  <circle cx="27" cy="31" r="1.5" fill="#f3b62b"/>
  <circle cx="37" cy="31" r="1.5" fill="#f3b62b"/>
  <circle cx="28" cy="39" r="1.3" fill="#f3b62b"/>
  <circle cx="36" cy="39" r="1.3" fill="#f3b62b"/>
</svg>
