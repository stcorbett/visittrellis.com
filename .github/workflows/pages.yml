# Builds _site/ from src/ and publishes it to GitHub Pages on every push to
# main (bin/deploy is the usual way to push). Pages must be set to
# "Source: GitHub Actions" in the repo settings — see docs/DEPLOY.md.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # reads .ruby-version; installs tailwindcss-ruby
      - run: bundle exec bin/build
      - run: bundle exec bin/check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
